<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colheita Certa - Agrinho 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tela-jogo">
        <div id="placar">Pontos: <span id="pontos">0</span></div>
        <div id="fazendeiro">🤠</div>
    </div>

    <div id="painel-controle">
        <h2>Uai, bora produzir com sustentabilidade!</h2>
        <p>Use as <strong>setas do teclado (Esquerda / Direita)</strong> para mover o fazendeiro.</p>
        <p>Pegue o que é bão (💧, 🌱, ☀️) e fuja do que estraga a terra (🔥, 🚫)!</p>
        <button id="btn-reiniciar" onclick="reiniciarJogo()">Começar de Novo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
